name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Ps1Forge.sln
      - name: Build
        run: dotnet build Ps1Forge.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test Ps1Forge.sln -c Release --no-build --verbosity normal
      - name: Publish
        run: dotnet publish src/Ps1Forge.App/Ps1Forge.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/Ps1Forge
      - name: Bundle zlib runtime
        shell: pwsh
        run: |
          $zlib = Get-ChildItem -Path C:\ -Filter zlib1.dll -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64|mingw64|usr\\bin' } |
            Select-Object -First 1
          if (-not $zlib) { throw 'zlib1.dll was not found on the Windows runner.' }
          Copy-Item $zlib.FullName artifacts/Ps1Forge/zlib1.dll
          Write-Host "Bundled $($zlib.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: Ps1Forge-win-x64
          path: artifacts/Ps1Forge
